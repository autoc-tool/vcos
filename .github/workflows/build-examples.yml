name: build examples

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: vcos_studio/configurator/requirements.txt

      - name: install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build gcc-arm-none-eabi

      - name: install python dependencies
        run: python -m pip install -r vcos_studio/configurator/requirements.txt

      - name: build examples
        run: python tools/build_examples.py
