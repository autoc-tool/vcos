[pytest]
log_cli = true
log_cli_level = INFO
log_cli_format = [%(levelname)s - %(asctime)s] %(message)s
timeout = 600
timeout_func_only = True
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    R0: Radius 0 testcase
    R1: Radius 1 testcase
    R2: Radius 2 testcase
    R3: Radius 3 testcase